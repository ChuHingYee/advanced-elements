  rolldown: 1.2.14
  rollup-plugin-visualizer: ^7.1.1
  sass: 1.105.2
  size-limit: ^14.2.0
  turbo: 2.11.8
  typescript: 5.9.3
  unplugin-vue-components: ^32.1.0
  vite: ^8.0.0
