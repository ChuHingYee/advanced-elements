minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - sass@1.105.2

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - undici-types@6.21.0
  - semver@6.3.1
  - css-declaration-sorter@6.4.1

# <zh/> pnpm 12 起 .npmrc 仅保留 auth/registry，其他设置必须放这里；shamefully-hoist 是既有布局假设（各包构建脚本直接调用未声明的二进制，如 rolldown），不可静默丢失
# <en/> Since pnpm 12 .npmrc keeps only auth/registry; everything else lives here. shamefully-hoist is an existing layout assumption (package build scripts call undeclared binaries like rolldown) and must not be silently dropped
shamefullyHoist: true
shellEmulator: true

audit:
  # <zh/> 显式忽略：仅接受无 npm 补丁版本（patched <0.0.0）的 advisories，新漏洞一律先修再议。
  # <zh/> · xlsx*2：可选 peer（动态 import + sanitizeDataArray 兜底），补丁版仅 SheetJS CDN 分发，见 packages/table/src/utils/ensure-xlsx.ts。
  # <zh/> （braces/sprintf-js 已随 @changesets/cli@3 升级消失。）
  # <en/> Explicit ignores: only advisories with no npm patch (patched <0.0.0); new vulns must be fixed first.
  # <en/> · xlsx*2: optional peer (dynamic import + sanitizeDataArray fallback), patched builds ship via SheetJS CDN only, see packages/table/src/utils/ensure-xlsx.ts.
  # <en/> (braces/sprintf-js vanished with the @changesets/cli@3 upgrade.)
  ignore:
    - GHSA-4r6h-8v6p-xvw6
    - GHSA-5pgg-2g8v-p4x9

packages:
  - 'packages/**'
  - '!packages/__mocks__'
  - docs
  - play
  - dev-packages/**
  - '!**/__tests__/**'

#
# <zh/> 安全说明（pnpm 12 规范布局，本文件集中管理）：
# <zh/> · 有补丁的传递漏洞走下面 overrides 硬 pin（pnpm audit --fix 默认写入位置）；
# <zh/> · 时间/体积 preset 已换成 @size-limit/file + @size-limit/esbuild 直引（v11 small-lib 组合；v14 的 small-lib 改走 rolldown 会解析 CSS 报错），estimo/puppeteer 链（nanoid/extract-zip/basic-ftp/ip-address 共 8 项）直接消失；
# <zh/> · 无补丁的（xlsx*2）走上面 audit.ignore 显式忽略 + 此处留档。
# <en/> Security note (pnpm 12 canonical layout, managed here):
# <en/> · patchable transitive vulns are hard-pinned in overrides below (pnpm audit --fix default target);
# <en/> · time/size preset replaced by direct @size-limit/file + @size-limit/esbuild (v11 small-lib combo; v14 small-lib goes through rolldown which fails parsing CSS), estimo/puppeteer chain (8 advisories: nanoid/extract-zip/basic-ftp/ip-address) gone;
# <en/> · unpatchable ones (xlsx*2) use audit.ignore above with this doc.
overrides:
  # <zh/> GHSA-qhr7/GHSA-6j4f/GHSA-q2hr：eslint 经 minimatch 的 brace-expansion DoS | <en/> brace-expansion DoS via eslint minimatch chain
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  # <zh/> GHSA-hrr3 + GHSA-w74x/wjr9/xhq7/333x（2026-10 新增，3.1.8 已落入新区间）：
  # <zh/> ajv/webpack 经 fast-uri 的多类校验缺陷（pin 3.1.9，不跟 4.x 大版本） | <en/> ajv/webpack fast-uri advisories (pin 3.1.9, stay off 4.x major)
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  # <zh/> GHSA-xjj6/4qv8/f72v（2026-10 新增，含 1 high）：jsdom@30 ← vitest 链带入的 undici 请求走私/证书校验缺陷（pin 8.12.3） | <en/> GHSA-xjj6/4qv8/f72v (2026-10, one high): request-smuggling/cert flaws in undici pulled via jsdom@30 ← vitest (pin 8.12.3)
  undici@>=8.0.0 <8.12.2: 8.12.3
  # <zh/> GHSA-238p low：eslint markdown 经 katex 原型污染小工具 | <en/> katex gadget via eslint markdown
  katex@>=0.11.0 <0.18.2: 0.18.2

  # <zh/> GHSA-pqg4-j6r4-53mv critical：npm-run-all2 经 shell-quote 注入 | <en/> GHSA-pqg4 critical: shell-quote injection via npm-run-all2
  shell-quote@>=1.8.4 <1.11.0: 1.12.0
  # <zh/> GHSA-68fv：vue compiler 经 source-map-js 事件循环 DoS | <en/> source-map-js event-loop DoS via vue compiler
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  # <zh/> GHSA-587h/GHSA-698v/GHSA-r825：vite launch-editor Windows 路径/命令注入 | <en/> vite launch-editor Windows path/command injection
  vite: 8.3.4

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
#
# <zh/> 单一版本源：跨包共享的依赖一律走 catalog，杜绝同一依赖多版本并存引发的 peer 冲突
# <en/> Single source of truth: cross-package shared deps go through catalog, preventing peer conflicts from duplicate versions
catalog:
